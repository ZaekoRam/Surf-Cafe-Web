<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="130" viewBox="0 0 1200 130" role="img" aria-label="Más de 15 años, 6 páginas públicas, 7 módulos de administración, 10 tablas con RLS">
  <style>.mono{font-family:'Courier New',Consolas,Menlo,monospace}</style>
  <rect width="1200" height="130" rx="10" fill="#0A0D12" stroke="#2A2E35"/>
  <g class="mono" text-anchor="middle">
    <text x="150" y="68" font-size="52" font-weight="700" fill="#21E14B">15+</text>
    <text x="150" y="98" font-size="14" fill="#7C8794" letter-spacing="3">AÑOS DEL NEGOCIO</text>
    <line x1="300" y1="26" x2="300" y2="104" stroke="#2A2E35"/>
    <text x="450" y="68" font-size="52" font-weight="700" fill="#E6FF00">6</text>
    <text x="450" y="98" font-size="14" fill="#7C8794" letter-spacing="3">PÁGINAS PÚBLICAS</text>
    <line x1="600" y1="26" x2="600" y2="104" stroke="#2A2E35"/>
    <text x="750" y="68" font-size="52" font-weight="700" fill="#00F0FF">7</text>
    <text x="750" y="98" font-size="14" fill="#7C8794" letter-spacing="3">MÓDULOS DE ADMIN</text>
    <line x1="900" y1="26" x2="900" y2="104" stroke="#2A2E35"/>
    <text x="1050" y="68" font-size="52" font-weight="700" fill="#FF00A8">10</text>
    <text x="1050" y="98" font-size="14" fill="#7C8794" letter-spacing="3">TABLAS CON RLS</text>
  </g>
</svg>
